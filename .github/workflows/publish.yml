name: Publish Quarto Book

on:
  push:
    branches: [master]   # your default branch: main or master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # Build and publish the book (_book/). Delete this line to publish the
      # website (_site/) instead.
      QUARTO_PROFILE: book
      LANG: C.UTF-8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The report uses base R graphics and knitr only.
      - name: Install R packages
        run: install.packages(c("knitr", "rmarkdown"))
        shell: Rscript {0}

      # Renders with the profile above, then pushes the result to gh-pages.
      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
